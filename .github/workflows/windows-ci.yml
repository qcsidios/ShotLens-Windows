name: Windows CI

on:
  push:
    branches:
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: 锁定依赖还原
        shell: pwsh
        run: dotnet restore ShotLens.Windows.sln --locked-mode

      - name: 运行测试
        shell: pwsh
        run: dotnet test ShotLens.Windows.sln --configuration Release --no-restore

      - name: 构建 Solution
        shell: pwsh
        run: dotnet build ShotLens.Windows.sln --configuration Release --no-restore

      - name: 运行命令冒烟
        shell: pwsh
        run: dotnet run --project src/ShotLens.Windows.App/ShotLens.Windows.App.csproj --configuration Release --no-build -- --smoke

      - name: 运行窗口冒烟
        shell: pwsh
        run: dotnet run --project src/ShotLens.Windows.App/ShotLens.Windows.App.csproj --configuration Release --no-build -- --smoke-window

      - name: 读取版本
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: 构建 beta 安装包
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version "${{ steps.version.outputs.value }}" -SkipTests

      - name: 上传 beta 安装包
        uses: actions/upload-artifact@v4
        with:
          name: ShotLens-Beta-${{ steps.version.outputs.value }}
          path: build/windows/ShotLens-Beta-${{ steps.version.outputs.value }}-Setup.exe
          if-no-files-found: error

name: Windows CI

on:
  push:
    branches:
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: 锁定依赖还原
        shell: pwsh
        run: dotnet restore ShotLens.Windows.sln --locked-mode --disable-parallel

      - name: 下载并校验 ONNX OCR 模型
        shell: pwsh
        run: ./scripts/download-onnx-ocr-models.ps1

      - name: 运行测试
        shell: pwsh
        env:
          SHOTLENS_RUN_OCR_MODEL_TESTS: "1"
          SHOTLENS_RUN_PADDLE_MODEL_TESTS: "1"
        run: dotnet test ShotLens.Windows.sln --configuration Release --no-restore

      - name: 构建 Solution
        shell: pwsh
        run: dotnet build ShotLens.Windows.sln --configuration Release --no-restore

      - name: 生成并校验 OCR 基准集
        shell: pwsh
        run: |
          dotnet run `
            --project tools/ShotLens.Windows.Ocr.Benchmark/ShotLens.Windows.Ocr.Benchmark.csproj `
            --configuration Release `
            --no-build `
            -- generate build/ocr-benchmark/dataset
          dotnet run `
            --project tools/ShotLens.Windows.Ocr.Benchmark/ShotLens.Windows.Ocr.Benchmark.csproj `
            --configuration Release `
            --no-build `
            -- validate build/ocr-benchmark/dataset

      - name: 发布 OCR 候选 Worker
        shell: pwsh
        run: |
          dotnet publish `
            src/ShotLens.Windows.Ocr.Worker/ShotLens.Windows.Ocr.Worker.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output build/ocr-benchmark/candidates-publish

      - name: 运行 ONNX OCR 完整基准
        shell: pwsh
        env:
          SHOTLENS_BENCHMARK_GPU: "GitHub Actions 未采集"
          SHOTLENS_BENCHMARK_POWER_MODE: "GitHub Actions 托管环境"
        run: |
          dotnet run `
            --project tools/ShotLens.Windows.Ocr.Benchmark/ShotLens.Windows.Ocr.Benchmark.csproj `
            --configuration Release `
            --no-build `
            -- run-onnx `
            build/ocr-benchmark/dataset `
            src/ShotLens.Windows.Ocr.Worker `
            build/ocr-benchmark/onnx-report `
            build/ocr-benchmark/candidates-publish

      - name: 运行 PaddleSharp OCR 完整基准
        shell: pwsh
        env:
          SHOTLENS_BENCHMARK_GPU: "GitHub Actions 未采集"
          SHOTLENS_BENCHMARK_POWER_MODE: "GitHub Actions 托管环境"
        run: |
          dotnet run `
            --project tools/ShotLens.Windows.Ocr.Benchmark/ShotLens.Windows.Ocr.Benchmark.csproj `
            --configuration Release `
            --no-build `
            -- run-paddlesharp `
            build/ocr-benchmark/dataset `
            src/ShotLens.Windows.Ocr.Worker `
            build/ocr-benchmark/paddlesharp-report `
            build/ocr-benchmark/candidates-publish

      - name: 运行命令冒烟
        shell: pwsh
        run: dotnet run --project src/ShotLens.Windows.App/ShotLens.Windows.App.csproj --configuration Release --no-build -- --smoke

      - name: 运行窗口冒烟
        shell: pwsh
        run: dotnet run --project src/ShotLens.Windows.App/ShotLens.Windows.App.csproj --configuration Release --no-build -- --smoke-window

      - name: 读取版本
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: 构建 beta 安装包
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version "${{ steps.version.outputs.value }}" -SkipTests

      - name: 上传 beta 安装包
        uses: actions/upload-artifact@v7
        with:
          name: ShotLens-Beta-${{ steps.version.outputs.value }}
          path: build/windows/ShotLens-Beta-${{ steps.version.outputs.value }}-Setup.exe
          if-no-files-found: error

      - name: 上传 OCR 生成基准
        uses: actions/upload-artifact@v7
        with:
          name: ShotLens-OCR-Generated-Benchmark
          path: build/ocr-benchmark/dataset
          if-no-files-found: error

      - name: 上传 ONNX OCR 基准报告
        uses: actions/upload-artifact@v7
        with:
          name: ShotLens-OCR-ONNX-Report
          path: build/ocr-benchmark/onnx-report
          if-no-files-found: error

      - name: 上传 PaddleSharp OCR 基准报告
        uses: actions/upload-artifact@v7
        with:
          name: ShotLens-OCR-PaddleSharp-Report
          path: build/ocr-benchmark/paddlesharp-report
          if-no-files-found: error

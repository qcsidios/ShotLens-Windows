name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    environment: release
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: 解析版本与发布通道
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match VERSION $version."
          }

          if ($version -match '^v\d+\.\d+\.\d+-beta\.[1-9]\d*$') {
            $channel = "beta"
            $asset = "ShotLens-Beta-$version-Setup.exe"
            $title = "ShotLens Windows $version"
            $prerelease = "true"
          } elseif ($version -match '^v\d+\.\d+\.\d+$') {
            $channel = "stable"
            $asset = "ShotLens-Windows-$version-Setup.exe"
            $title = "ShotLens Windows $version"
            $prerelease = "false"
          } else {
            throw "Unsupported release version: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "asset=$asset" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: 检查默认 API Secret
        shell: pwsh
        env:
          SHOTLENS_DEFAULT_API_KEY: ${{ secrets.SHOTLENS_DEFAULT_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SHOTLENS_DEFAULT_API_KEY)) {
            throw "SHOTLENS_DEFAULT_API_KEY is required for release builds."
          }

      - name: 构建安装包
        shell: pwsh
        env:
          SHOTLENS_DEFAULT_API_KEY: ${{ secrets.SHOTLENS_DEFAULT_API_KEY }}
        run: ./scripts/build-windows.ps1 -Version "${{ steps.release.outputs.version }}"

      - name: 上传工作流产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.asset }}
          path: build/windows/${{ steps.release.outputs.asset }}
          if-no-files-found: error

      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $title = "${{ steps.release.outputs.title }}"
          $asset = "build/windows/${{ steps.release.outputs.asset }}"
          $notes = "scripts/release-notes/$version.md"
          if (-not (Test-Path $notes)) {
            throw "Release notes not found: $notes"
          }

          if ("${{ steps.release.outputs.prerelease }}" -eq "true") {
            gh release create $version --title $title --notes-file $notes --prerelease $asset
          } else {
            gh release create $version --title $title --notes-file $notes $asset
          }
